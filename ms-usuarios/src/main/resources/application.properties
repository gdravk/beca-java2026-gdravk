spring.application.name=ms-usuarios

# porta da aplicacao (o ms2 vai chamar o ms1 em http://localhost:8081)
server.port=8081
# nunca manda o stack trace (o rastro interno do erro) na resposta, nem com o devtools ligado
server.error.include-stacktrace=never

# conexao com o banco de usuarios (container users-db do docker-compose)
# os valores ${...} sao lidos das variaveis de ambiente (as mesmas do arquivo .env)
spring.datasource.url=jdbc:postgresql://localhost:5432/${USERS_DB_NAME}
spring.datasource.username=${USERS_DB_USER}
spring.datasource.password=${USERS_DB_PASSWORD}

# jpa/hibernate
# update: cria as tabelas que nao existem e adiciona colunas novas, sem apagar os dados
spring.jpa.hibernate.ddl-auto=update
# mostra no console o sql que o hibernate executa no banco
spring.jpa.show-sql=true

# upload de arquivo (importacao de usuarios por csv, POST /users/import)
# 2MB cabe bem mais que o limite de 1000 usuarios por arquivo
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# chave interna: segredo compartilhado entre ms1 e ms2 para proteger o POST /auth/verificar
# o ms2 manda essa chave no cabecalho X-Chave-Interna; o valor vem da variavel MS1_CHAVE_INTERNA (do .env)
seguranca.chave-interna=${MS1_CHAVE_INTERNA}
