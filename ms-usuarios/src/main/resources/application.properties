spring.application.name=ms-usuarios

# porta da aplicacao (o ms2 chama o ms1 nela: localhost:8081 no intellij, ms-usuarios:8081 no docker)
server.port=8081
# nunca manda o stack trace (o rastro interno do erro) na resposta, nem com o devtools ligado
server.error.include-stacktrace=never

# conexao com o banco de usuarios (container users-db do docker-compose)
# os valores ${...} vem das variaveis de ambiente (as mesmas do arquivo .env); o que vem depois do ":" e o padrao
# - no intellij vale o padrao, localhost:5432
# - no docker compose, USERS_DB_HOST=users-db (dentro do docker, "localhost" seria o proprio container)
spring.datasource.url=jdbc:postgresql://${USERS_DB_HOST:localhost}:${USERS_DB_PORT:5432}/${USERS_DB_NAME}
spring.datasource.username=${USERS_DB_USER}
spring.datasource.password=${USERS_DB_PASSWORD}

# jpa/hibernate
# update: cria as tabelas que nao existem e adiciona colunas novas, sem apagar os dados
spring.jpa.hibernate.ddl-auto=update
# mostra no console o sql que o hibernate executa no banco
spring.jpa.show-sql=true
# open-in-view desligado: a conexao com o banco e devolvida assim que o adaptador termina a consulta, e nao
# so depois que a resposta e escrita. ele so serviria para carregar dados "preguicosos" (lazy) na hora de
# montar o json, e aqui nao existe isso: tudo vira objeto do dominio antes de sair do adaptador
# (sem esta linha, o spring ainda mostra um aviso no log toda vez que sobe)
spring.jpa.open-in-view=false

# upload de arquivo (importacao de usuarios por csv, POST /users/import)
# 2MB cabe bem mais que o limite de 1000 usuarios por arquivo
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# chave interna: segredo compartilhado entre ms1 e ms2 para proteger o POST /auth/verificar
# o ms2 manda essa chave no cabecalho X-Chave-Interna; o valor vem da variavel MS1_CHAVE_INTERNA (do .env)
seguranca.chave-interna=${MS1_CHAVE_INTERNA}

# swagger: o botao "try it out" ja vem ligado, entao da para executar as rotas direto, com um clique a menos
springdoc.swagger-ui.try-it-out-enabled=true
# swagger: as respostas aparecem como application/json (sem isso o swagger mostra o tipo generico */*)
springdoc.default-produces-media-type=application/json
# swagger ligado de proposito: o PO quer executar os pedidos pelo swagger (sem essas linhas o springdoc
# avisa no log que ficou ligado "por padrao"); num ambiente de producao de verdade, trocar para false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
