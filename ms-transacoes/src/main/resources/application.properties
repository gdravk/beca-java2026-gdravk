spring.application.name=ms-transacoes

# porta da aplicacao (o ms1 fica na 8081, o ms2 na 8082)
server.port=8082
# nunca manda o stack trace (o rastro interno do erro) na resposta, nem com o devtools ligado
server.error.include-stacktrace=never

# conexao com o banco de transacoes (container transactions-db do docker-compose)
# repara que a porta aqui e 5433: e a porta que o docker abriu no windows pra esse banco
# os valores ${...} sao lidos das variaveis de ambiente (as mesmas do arquivo .env)
spring.datasource.url=jdbc:postgresql://localhost:5433/${TRANSACTIONS_DB_NAME}
spring.datasource.username=${TRANSACTIONS_DB_USER}
spring.datasource.password=${TRANSACTIONS_DB_PASSWORD}

# jpa/hibernate
# update: cria as tabelas que nao existem e adiciona colunas novas, sem apagar os dados
spring.jpa.hibernate.ddl-auto=update
# mostra no console o sql que o hibernate executa no banco
spring.jpa.show-sql=true

# api mock (mockapi.io): servico externo que guarda saldo e limites de cada usuario
# a url vem da variavel de ambiente MOCKAPI_BASE_URL (do .env), nunca escrita aqui no codigo
# o nome "mockapi.base-url" fomos nos que inventamos; o MockApiSaldoAdapter le ela com @Value
mockapi.base-url=${MOCKAPI_BASE_URL}
# tempo maximo (em milissegundos) esperando a api mock responder
# se passar disso, a gente desiste e trata como "servico indisponivel", em vez de deixar o usuario esperando
mockapi.timeout-ms=3000

# brasilapi: api publica de cambio (cotacoes do banco central), usada pra converter os valores pra dolar e euro
# a url vem da variavel BRASILAPI_BASE_URL (.env); o que vem depois dos ":" e o valor padrao,
# usado quando a variavel nao existe (como a url e publica e nao e segredo, tudo bem ter um padrao aqui)
brasilapi.base-url=${BRASILAPI_BASE_URL:https://brasilapi.com.br/api}
brasilapi.timeout-ms=3000

# ms1 (usuarios): o ms2 confere o login de cada requisicao chamando POST {ms1}/auth/verificar
# no intellij o padrao localhost:8081 ja funciona; no docker compose a variavel MS1_URL aponta pro container
ms1.base-url=${MS1_URL:http://localhost:8081}
ms1.timeout-ms=3000
# chave interna mandada no cabecalho X-Chave-Interna; precisa ser igual a do ms1 (variavel MS1_CHAVE_INTERNA)
ms1.chave-interna=${MS1_CHAVE_INTERNA}
